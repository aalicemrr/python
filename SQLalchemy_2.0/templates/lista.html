<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Loja Tech</title>
</head>
<body>

<h1>Loja Tech</h1>

<a href="{{ url_for('cadastrar') }}">
Novo Produto
</a>

<hr>

<table border="1" cellpadding="8">
<tr>
<th>ID</th>
<th>Nome</th>
<th>Categoria</th>
<th>Preço</th>
<th>Estoque</th>
<th>Ações</th>
</tr>

{% for produto in produtos %}
<tr>
<td>{{ produto.id }}</td>
<td>{{ produto.nome }}</td>
<td>{{ produto.categoria }}</td>
<td>R$ {{ "%.2f"|format(produto.preco) }}</td>
<td>{{ produto.estoque }}</td>
<td>
<a href="{{ url_for('editar', produto_id=produto.id) }}">
Editar
</a>

<form
action="{{ url_for('excluir', produto_id=produto.id) }}"
method="post"
style="display:inline;"
>
<button type="submit">
Excluir
</button>
</form>
</td>
</tr>
{% endfor %}

</table>

</body>
</html>
